name: stats

on:
  schedule:
    # 04:10 UTC daily — after the contribution calendar has settled for most
    # of the previous day in IST.
    - cron: "10 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw static graphics
        run: |
          python scripts/gen_headings.py
          python scripts/gen_hero.py

      - name: Draw stats from the GraphQL API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python scripts/gen_stats.py

      - name: Commit only what changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.svg'
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "stats: $(date -u +%Y-%m-%d)"
          git push
